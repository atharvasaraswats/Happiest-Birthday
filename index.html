<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Happy Birthday 💖</title>
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@300;600&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(135deg, #ff9ad5, #ffd1ec);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Poppins', sans-serif;
      overflow: hidden;
    }

    /* Main card */
    .card {
      background: rgba(255, 255, 255, 0.85);
      border-radius: 25px;
      padding: 40px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(255, 20, 147, 0.4);
      animation: pop 1s ease-out;
      max-width: 420px;
      z-index: 2;
    }

    h1 {
      font-family: 'Pacifico', cursive;
      font-size: 3rem;
      color: #ff2f92;
      margin-bottom: 10px;
    }

    p {
      font-size: 1.1rem;
      color: #444;
      margin: 10px 0;
    }

    .from {
      margin-top: 25px;
      font-weight: 600;
      color: #ff2f92;
    }

    /* Floating hearts */
    .heart {
      position: absolute;
      font-size: 20px;
      animation: float 6s linear infinite;
      opacity: 0.8;
      z-index: 1;
    }

    @keyframes float {
      0% { transform: translateY(100vh) scale(0.5); opacity: 0; }
      20% { opacity: 1; }
      100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
    }

    @keyframes pop {
      0% { transform: scale(0.6); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    /* Floating wish boxes */
    .wish-box {
      position: absolute;
      width: 220px;
      background: rgba(255,255,255,0.9);
      border-radius: 18px;
      padding: 15px;
      box-shadow: 0 10px 30px rgba(255, 47, 146, 0.3);
      animation: drift 18s linear infinite;
      font-size: 0.95rem;
    }

    .wish-from {
      margin-top: 8px;
      font-weight: 600;
      color: #ff2f92;
      text-align: right;
      font-size: 0.85rem;
    }

    @keyframes drift {
      from { transform: translateY(110vh); }
      to { transform: translateY(-120vh); }
    }
  </style>
</head>

<body>

  <div class="card">
    <h1>Happy Birthday 💕</h1>
    <p>
      Today the world got upgraded ✨  
      More smiles, more chaos, more YOU.
    </p>
    <p>
      Stay cute. Stay powerful.  
      Stay dangerously adorable 😌💖
    </p>
    <div class="from">— from me 💌</div>
  </div>

  <script>
    /* Floating hearts */
    const hearts = ["💖","💕","💗","💓","💞","🎀","✨"];
    function createHeart() {
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.animationDuration = 4 + Math.random() * 4 + "s";
      heart.innerText = hearts[Math.floor(Math.random() * hearts.length)];
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 7000);
    }
    setInterval(createHeart, 300);

    /* Load wishes from text files */
    const wishFiles = [
      "wishes/wish1.txt",
      "wishes/wish2.txt",
      "wishes/wish3.txt",
      "wishes/wish4.txt",
      "wishes/wish5.txt"
    ];

    wishFiles.forEach((file, index) => {
      fetch(file)
        .then(res => res.text())
        .then(data => {
          const [message, from] = data.split("\n---\n");

          const box = document.createElement("div");
          box.className = "wish-box";
          box.style.left = (10 + index * 18) + "vw";
          box.style.animationDuration = (16 + Math.random() * 8) + "s";

          box.innerHTML = `
            <div>${message}</div>
            <div class="wish-from">— ${from}</div>
          `;

          document.body.appendChild(box);
        });
    });
  </script>

</body>
</html>
