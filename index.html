<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Happy Birthday 💖</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@300;600&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #ffb6d9, #ffcce6);
      font-family: 'Poppins', sans-serif;
      overflow-x: hidden;
      padding-top: 60px; /* Add top padding so card doesn’t touch top */
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start; /* card starts near top */
      position: relative;
    }

    /* Main birthday card */
    .card {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 25px;
      padding: 40px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(255, 20, 147, 0.35);
      animation: pop 1s ease-out;
      max-width: 420px;
      z-index: 2;
      position: relative;
    }

    h1 {
      font-family: 'Pacifico', cursive;
      font-size: 3rem;
      color: #ff2f92;
      margin-bottom: 15px;
      text-shadow: 0 2px 6px rgba(255, 47, 146, 0.5);
    }

    p {
      font-size: 1.15rem;
      color: #444;
      margin: 10px 0;
      line-height: 1.5;
    }

    .from {
      margin-top: 25px;
      font-weight: 600;
      color: #ff2f92;
    }

    /* Wishes section */
    .wishes-container {
      margin-top: 30px;
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 1000px;
      padding: 0 20px 40px; /* small bottom padding */
      z-index: 2;
    }

    .wish-box {
      width: 220px;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 18px;
      padding: 15px;
      box-shadow: 0 8px 25px rgba(255, 47, 146, 0.25);
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.6s ease;
      font-size: 0.95rem;
    }

    .wish-box.show {
      opacity: 1;
      transform: translateY(0);
    }

    .wish-from {
      margin-top: 8px;
      font-weight: 600;
      color: #ff2f92;
      text-align: right;
      font-size: 0.85rem;
    }

    /* Floating hearts */
    .heart {
      position: fixed; /* make relative to viewport */
      top: -30px; /* start slightly above top */
      font-size: 22px;
      animation: float 5s linear infinite;
      opacity: 0.8;
      z-index: 1;
      text-shadow: 0 1px 4px rgba(255, 47, 146, 0.7);
      pointer-events: none; /* doesn’t block scrolling */
    }

    @keyframes float {
      0% { transform: translateY(-30px) scale(0.6); opacity: 0; }
      20% { opacity: 1; }
      100% { transform: translateY(120vh) scale(1.2); opacity: 0; }
    }

    @keyframes pop {
      0% { transform: scale(0.6); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

  </style>
</head>

<body>

  <!-- Main card -->
  <div class="card">
    <h1>Happy Birthday 💕</h1>
    <p>
      Today the world got upgraded ✨<br>
      More smiles, more chaos, more YOU.
    </p>
    <p>
      Stay cute. Stay powerful.<br>
      Stay dangerously adorable 😌💖
    </p>
    <div class="from">— from me 💌</div>
  </div>

  <!-- Wishes -->
  <div class="wishes-container" id="wishes"></div>

  <script>
    /* Floating hearts */
    const hearts = ["💖","💕","💗","💓","💞","🎀","✨"];
    function createHeart() {
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.animationDuration = 4 + Math.random() * 3 + "s";
      heart.innerText = hearts[Math.floor(Math.random() * hearts.length)];
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 7000);
    }
    setInterval(createHeart, 300);

    /* Load wishes from text files */
    const wishFiles = [
      "wishes/wish1.txt"
    
    ];

    const container = document.getElementById("wishes");

    wishFiles.forEach((file, index) => {
      fetch(file)
        .then(res => res.text())
        .then(data => {
          const parts = data.split("\n---\n");
          const message = parts[0] || "";
          const from = parts[1] || "";

          const box = document.createElement("div");
          box.className = "wish-box";
          box.innerHTML = `
            <div>${message}</div>
            <div class="wish-from">— ${from}</div>
          `;

          container.appendChild(box);

          setTimeout(() => {
            box.classList.add("show");
          }, index * 1200);
        });
    });
  </script>

</body>
  </html>
